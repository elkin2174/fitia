services:
  - type: web
    name: fitia-api
    env: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: America/Bogota
      - key: GEMINI_TTS_MODEL
        value: gemini-3.8-flash-tts
      - key: GEMINI_TTS_VOICE
        value: Aoede
